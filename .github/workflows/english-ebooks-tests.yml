name: English EPUB translator tests
on:
  push:
    paths:
      - 'english-ebooks-translator/**'
      - '.github/workflows/english-ebooks-tests.yml'
  pull_request:
    paths:
      - 'english-ebooks-translator/**'
      - '.github/workflows/english-ebooks-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline fixture tests only (no e-books, no API keys)
        working-directory: english-ebooks-translator
        run: python -m unittest discover -s tests -v
