name: Release MyTV CN Checker v1.1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/iptv-car-checker-v11.yml"
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade v1.0 ZIP with channel matching and diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import json, re, zipfile, hashlib, subprocess, sys

          base=Path("iptv-car/releases")
          original=base/"MyTV_Car_IPTV_CN_Checker_Win11_v1.0.zip"
          out=base/"MyTV_Car_IPTV_CN_Checker_Win11_v1.1.zip"
          expected="20f1a79f012a46926ec4e46951509e764318fa781fb7eb59d459db8237c43896"
          if hashlib.sha256(original.read_bytes()).hexdigest()!=expected:
              raise RuntimeError("v1.0 archive hash unexpected; no upgrade")
          def patch(text,old,new):
              if old not in text: raise RuntimeError("Missing patch context: "+old[:80])
              return text.replace(old,new,1)
          with TemporaryDirectory() as tmp:
              root=Path(tmp)/"mytv-car-cn-checker"
              with zipfile.ZipFile(original) as z: z.extractall(tmp)
              f=root/"checker.py"
              s=f.read_text("utf-8")
              s=patch(s, '标清))?', '标清|综合|新闻|财经|综艺|中文国际|体育|电影|军事|农业农村|科教|少儿|纪录|音乐|戏曲|奥林匹克))*')
              s=patch(s, '"中央一套": "CCTV-1",', '"中央一套": "CCTV-1", "央视一套": "CCTV-1",')
              s=patch(s, '                if len(by_source) < int(config.get("max_per_source_channel", 5)):',
                      '                cap = int(config.get("max_per_source_critical", 15)) if name in CCTV_FIRST else int(config.get("max_per_source_channel", 5))\n                if len(by_source) < cap:')
              s=patch(s, '    for name in priorities:\n        # Round-robin across sources',
                      '    for name in priorities:\n        max_candidates = int(config.get("max_candidates_critical", 40)) if name in CCTV_FIRST else int(config.get("max_candidates_per_channel", 16))\n        # Round-robin across sources')
              s=patch(s, '        per_channel[name] = urls\n    return per_channel, reports',
                      '        per_channel[name] = urls\n    log("  重点候选数量：" + "; ".join(f"{c}: {len(per_channel[c])}" for c in CCTV_FIRST))\n    return per_channel, reports')
              s=patch(s, '    results = {}\n    def probe_item(url):',
                      '    results = {}\n    critical_urls = {u for c in CCTV_FIRST for u,_ in per_channel.get(c,[])}\n    def probe_item(url):')
              old='''            if r.success and config.get("double_check_critical", True) and any(url in [u for u, _ in per_channel[c]] for c in CCTV_FIRST):
                          # Second request reduces the risk of transient one-off HLS success.
                          second = validate(url, config)
                          if not second.success:
                              return url, Result(False, "second_check_" + second.reason)
                          r = Result(True, "verified_twice", max(r.latency_s, second.latency_s), min(r.speed_kib_s, second.speed_kib_s), min(r.sample_bytes, second.sample_bytes))'''
              new='''            if config.get("double_check_critical", True) and url in critical_urls:
                          attempts = [r, validate(url, config)]
                          if sum(x.success for x in attempts) == 1:
                              attempts.append(validate(url, config))
                          passed = [x for x in attempts if x.success]
                          if len(passed) >= 2:
                              r = Result(True, "verified_twice", max(x.latency_s for x in passed), min(x.speed_kib_s for x in passed), min(x.sample_bytes for x in passed))
                          else:
                              r = Result(False, "critical_" + "+".join(x.reason for x in attempts if not x.success))'''
              s=patch(s,old,new)
              s=patch(s, '    return results\n\n\ndef render(',
                     '''    for channel in CCTV_FIRST:
                  failed=Counter(results[u].reason for u,_ in per_channel[channel] if u in results and not results[u].success)
                  passed=sum(results[u].success for u,_ in per_channel[channel] if u in results)
                  log(f"  [详细诊断] {channel}: {len(per_channel[channel])} 个候选，{passed} 个通过；失败原因 {dict(failed)}")
              return results
          
          
          def render(''')
              s=patch(s,'        "critical": {ch: len(groups.get(ch, [])) for ch in CCTV_FIRST},',
                      '''        "critical": {ch: len(groups.get(ch, [])) for ch in CCTV_FIRST},
                  "critical_candidate_diagnostics": {
                      c: [{"host": urllib.parse.urlsplit(u).hostname,
                           "path": urllib.parse.urlsplit(u).path,
                           "ok": checks[u].success,
                           "reason": checks[u].reason,
                           "speed_kib_s": round(checks[u].speed_kib_s, 1)}
                          for u,_ in per_channel[c] if u in checks] for c in CCTV_FIRST
                  },''')
              s=patch(s, 'log("MyTV 车机国内网络直播源筛选器 v1.0")',
                      'log("MyTV 车机国内网络直播源筛选器 v1.1")')
              f.write_text(s,"utf-8")
              f=root/"stream_probe.py"
              s=f.read_text("utf-8")
              s=patch(s, 'def fetch_bytes(url: str, opener, limit: int, timeout: float, total_deadline: float):',
                      'def fetch_bytes(url: str, opener, limit: int, timeout: float, total_deadline: float, use_range=True):')
              s=patch(s, '    req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT, "Accept": "*/*", "Range": f"bytes=0-{limit-1}"})\n    with opener.open(req, timeout=timeout) as resp:',
                      '''    headers={"User-Agent": USER_AGENT, "Accept": "*/*"}
              if use_range: headers["Range"] = f"bytes=0-{limit-1}"
              req=urllib.request.Request(url,headers=headers)
              try:
                  resp=opener.open(req,timeout=timeout)
              except urllib.error.HTTPError as err:
                  if not use_range or err.code not in (400,416): raise
                  resp=opener.open(urllib.request.Request(url,headers={"User-Agent": USER_AGENT,"Accept": "*/*"}),timeout=timeout)
              with resp:''')
              s=patch(s, 'float(cfg["max_total_sample_s"]))\n            if not data.lstrip().startswith(b"#EXTM3U"):',
                      'float(cfg["max_total_sample_s"]), use_range=False)\n            if not data.lstrip().startswith(b"#EXTM3U"):')
              f.write_text(s,"utf-8")
              f=root/"config.json"
              config=json.loads(f.read_text("utf-8"))
              config["max_per_source_critical"]=15
              config["max_candidates_critical"]=40
              config["sources"].insert(5,{"name":"BurningC4-IPv4","enabled":True,"url":"https://raw.githubusercontent.com/BurningC4/Chinese-IPTV/master/TV-IPV4.m3u"})
              config["sources"].insert(6,{"name":"YanG-Github-Gather","enabled":True,"url":"https://raw.githubusercontent.com/YanG-1989/m3u/main/Gather.m3u"})
              f.write_text(json.dumps(config,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              (root/"v1.1-更新说明.txt").write_text(
                  "v1.1 更新：识别 CCTV-1 综合 / CCTV-13 新闻；增加两个候选源；CCTV1/13 最多采集40条；连续验证允许三次中两次通过；修复部分 HLS Range 兼容；失败原因显示在程序及 status-cn.json 的 critical_candidate_diagnostics。\n"
                  "仍保留 CCTV-1 和 CCTV-13 都必须有实测通过的线路才允许上传的保护。运行前可先双击仅测试不上传脚本。\n",encoding="utf-8")
              subprocess.run([sys.executable,"-m","compileall","-q",str(root)],check=True)
              sys.path.insert(0,str(root))
              from checker import canonical
              assert canonical("CCTV-1 综合")=="CCTV-1"
              assert canonical("CCTV-13 新闻")=="CCTV-13"
              assert canonical("CCTV-5+ 体育")=="CCTV-5+"
              with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for path in root.rglob("*"):
                      if path.is_file() and "__pycache__" not in path.parts:
                          z.write(path,path.relative_to(Path(tmp)))
          with zipfile.ZipFile(out) as z: assert z.testzip() is None
          print("Built",out, out.stat().st_size, "bytes; sha256",hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Commit release ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv-car/releases/MyTV_Car_IPTV_CN_Checker_Win11_v1.1.zip
          git commit -m "release(iptv): publish CCTV focused local checker v1.1"
          git pull --rebase origin main
          git push origin HEAD:main
