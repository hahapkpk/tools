name: Apply user verified IPTV playlist

on:
  push:
    paths:
      - ".github/workflows/iptv-car-apply-user-playlist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact user-supplied M3U and verify integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          payload = ""
          content = zlib.decompress(base64.b64decode(payload))
          expected_sha256 = "a64392bdf9db1831a6c80fbf34132ec800c128544debc990384f7eeeaa49518f"
          if hashlib.sha256(content).hexdigest() != expected_sha256:
              raise SystemExit("The uploaded file integrity check failed")
          if not content.startswith(b"#EXTM3U"):
              raise SystemExit("Not an M3U file")
          dest = Path("iptv-car/live.m3u")
          dest.write_bytes(content)
          print(f"Restored user playlist: {len(content)} bytes; {content.count(b'#EXTINF:')} entries")
          PY
      - name: Commit updated user subscription
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv-car/live.m3u
          if git diff --cached --quiet; then
            echo "Already matches the uploaded file"
          else
            git commit -m "feat(iptv): replace car live.m3u with user's verified China playlist"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
